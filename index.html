<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОСБ — редактор документов</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>window.__pdfWorkerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@myriaddreamin/typst.ts@0.7.0/dist/esm/contrib/all-in-one-lite.bundle.js" id="typst"></script>
<script src="assets/gerb.js" defer></script>
<script src="assets/sign-default.js" defer></script>
<script src="assets/seal.js" defer></script>
<script src="assets/fonts.js" defer></script>
<script src="templates.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">ОСБ <span>· Автор: Vladislav_Shetkov</span></div>
  <nav class="tabs" id="templateTabs" role="tablist" aria-label="Выбор шаблона">
    <button data-t="trebovanie" role="tab">Требование (beta)</button>
    <button data-t="proverka" role="tab">Постановление на СП</button>
    <button data-t="otstranenie" role="tab">Отстранение (beta)</button>
    <button data-t="unsp" role="tab">Уведомление о начале СП</button>
    <button data-t="uksp" role="tab">Уведомление об окончании СП</button>
    <button data-t="protokol_oprosa" role="tab">Протокол опроса</button>
  </nav>
  <div class="topright">
    <button id="btnCases" class="cases-btn" title="Дела: создать, открыть, удалить">📁 Вне дел ▾</button>
    <div class="status" id="status">Загрузка…</div>
  </div>
  <div class="cases-menu" id="casesMenu" hidden></div>
</header>

<div class="casebar" id="caseBar" hidden>
  <div class="casebar-top">
    <button id="btnBackFree" class="mini" title="Вернуться к простым документам без дел">← Вне дел</button>
    <span class="casebar-title" id="caseTitle"></span>
    <span class="casebar-descr" id="caseDescr"></span>
    <span class="casebar-actions">
      <button id="btnRenameCase" class="mini" title="Переименовать дело">✎</button>
      <button id="btnExportCase" class="mini" title="Скачать дело в JSON (бэкап)">JSON↓</button>
      <button id="btnDeleteCase" class="mini danger" title="Удалить дело">Удалить</button>
    </span>
  </div>
  <div class="casebar-docs">
    <div class="docchips" id="docChips"></div>
    <div class="adddoc-wrap">
      <button id="btnAddDoc" class="mini" title="Добавить документ в дело">+ Документ ▾</button>
      <div class="adddoc-menu" id="addDocMenu" hidden></div>
    </div>
  </div>
</div>

<main class="layout">
  <section class="forms">
    <details class="card profile">
      <summary>Постоянные данные <span class="hint">сохраняются для всех документов</span></summary>
      <div id="profileForm"></div>
    </details>
    <div id="docForm"></div>
  </section>

  <div class="splitter" id="splitter" title="Потяните, чтобы изменить ширину панелей"></div>

  <section class="preview-pane">
    <div class="toolbar">
      <button id="btnPdf" class="primary" disabled>Скачать PDF</button>
      <button id="btnJpg" disabled>Скачать JPG</button>
      <button id="btnTyp" disabled>Скачать .typ</button>
      <span class="sep"></span>
      <button id="btnFill" title="Заполнить форму примером">Пример</button>
      <button id="btnClear" title="Очистить текущий документ">Очистить</button>
    </div>
    <div class="error" id="errorBox" hidden></div>
    <div class="pages" id="pages">
      <div class="placeholder">Предпросмотр появится после загрузки компилятора Typst…</div>
    </div>
  </section>
</main>

<footer class="foot">
  <span>Данные хранятся локально в браузере (localStorage). Для работы нужен интернет (загрузка компилятора Typst с CDN).</span>
</footer>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle">Новое дело</h3>
    <div class="field"><label>Название <span class="req">*</span></label><input type="text" id="modalName" maxlength="120"></div>
    <div class="field"><label>Краткое описание</label><textarea id="modalDescr" maxlength="500"></textarea></div>
    <div class="modal-row">
      <button id="modalOk" class="primary">Сохранить</button>
      <button id="modalCancel">Отмена</button>
    </div>
  </div>
</div>
<input type="file" id="importCaseFile" accept="application/json,.json" hidden>
</body>
</html>
